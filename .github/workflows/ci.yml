name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, types, tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  templates:
    name: Generated template (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [basic, express, fastify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Scaffold and verify ${{ matrix.template }}
        run: |
          target="$(mktemp -d)/app"
          node index.js "$target" --template "${{ matrix.template }}" --package-manager npm --yes --no-git
          cd "$target"
          npm run type-check
          npm run lint
          npm run format:check
          npm run build
          if [ "${{ matrix.template }}" = "basic" ]; then
            npm start
          else
            npm start &
            server_pid=$!
            for i in $(seq 1 15); do
              curl --silent --fail http://localhost:3000/health >/dev/null && break
              sleep 1
            done
            curl --silent --fail http://localhost:3000/health
            kill "$server_pid" || true
          fi
